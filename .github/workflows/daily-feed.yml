name: Daily Aignal Feed

on:
  push:
    branches:
      - main
  schedule:
    # Trigger at both possible UTC offsets, then gate on 06:00 in Los Angeles.
    - cron: "0 13,14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Pacific schedule
        id: schedule_gate
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" || "$(TZ=America/Los_Angeles date +%H)" == "06" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.schedule_gate.outputs.should_run == 'true'
        with:
          node-version: 20

      - name: Generate daily feed
        if: steps.schedule_gate.outputs.should_run == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: npm run generate-feed -- --fresh-window-hours=36 --fallback-fresh-window-hours=168

      - name: Validate daily feed
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: npm run validate-feed -- --min-source-images=6 --require-images

      - name: Commit generated feed archive
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p public/images
          git add public/feed public/images
          git diff --cached --quiet || git commit -m "Update daily Aignal feed"
          git push

      - name: Install web dependencies
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: npm ci --prefix web

      - name: Build web app
        if: steps.schedule_gate.outputs.should_run == 'true'
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build-web

      - uses: actions/configure-pages@v5
        if: steps.schedule_gate.outputs.should_run == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.schedule_gate.outputs.should_run == 'true'
        with:
          path: web/out

      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.schedule_gate.outputs.should_run == 'true'
